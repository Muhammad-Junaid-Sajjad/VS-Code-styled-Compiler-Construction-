name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system toolchain (lex / yacc / gcc)
        run: sudo apt-get update && sudo apt-get install -y flex bison gcc

      - name: make setup (venv + pip deps + npm ci)
        run: make setup

      - name: Install Playwright Chromium (+ system deps)
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: make test (pytest + Playwright E2E)
        run: make test
